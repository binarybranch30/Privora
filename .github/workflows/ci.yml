name: MVP checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: policyguard
          POSTGRES_USER: policyguard
          POSTGRES_PASSWORD: policyguard
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U policyguard" --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://policyguard:policyguard@127.0.0.1:5432/policyguard
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
